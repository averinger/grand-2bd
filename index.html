<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Камера</title>
<style>
  body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
  }
  #video {
    width: 100%;
    max-width: 640px;
    border-radius: 12px;
    background: #000;
    transform: scaleX(-1); /* зеркалим для фронталки, убери если не нужно */
  }
  #video.rear {
    transform: none;
  }
  button {
    padding: 12px 24px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #2d7ef7;
    color: #fff;
    cursor: pointer;
  }
  button:disabled { background: #555; cursor: default; }
  #error {
    color: #ff6b6b;
    max-width: 640px;
    text-align: center;
    padding: 0 16px;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<div>
  <button id="startBtn">Включить камеру</button>
  <button id="switchBtn" disabled>Переключить камеру</button>
</div>
<div id="error"></div>

<script>
const video     = document.getElementById('video');
const startBtn  = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const errorEl   = document.getElementById('error');

let stream = null;
let facingMode = 'user'; // 'user' = фронталка, 'environment' = задняя

async function startCamera() {
  errorEl.textContent = '';
  startBtn.disabled = true;

  // Останавливаем предыдущий поток, если был
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    video.classList.toggle('rear', facingMode === 'environment');
    switchBtn.disabled = false;
  } catch (err) {
    handleError(err);
    startBtn.disabled = false;
  }
}

function handleError(err) {
  switch (err.name) {
    case 'NotAllowedError':
      errorEl.textContent = 'Доступ к камере запрещён. Разрешите его в настройках браузера.';
      break;
    case 'NotFoundError':
      errorEl.textContent = 'Камера не найдена на устройстве.';
      break;
    case 'NotReadableError':
      errorEl.textContent = 'Камера занята другим приложением.';
      break;
    case 'OverconstrainedError':
      errorEl.textContent = 'Не удалось подобрать параметры камеры.';
      break;
    default:
      errorEl.textContent = 'Ошибка доступа к камере: ' + (err.message || err.name);
  }
  console.error(err);
}

startBtn.addEventListener('click', startCamera);

switchBtn.addEventListener('click', () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startCamera();
});

// Автозапуск при загрузке (браузер всё равно спросит разрешение)
startCamera();
</script>

</body>
</html>
