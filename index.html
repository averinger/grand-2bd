<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat — Multi Provider</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--panel:#10101a;--panel-2:#16161f;--border:#1e1e2e;--accent:#7c5cff;--accent-dim:#5a3fd6;--green:#2ecc71;--amber:#f39c12;--red:#e63946;--text:#e8e8f2;--muted:#6a6a85;--muted-2:#4a4a5e}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;position:fixed;inset:0}
.hidden{display:none!important}
#app{display:grid;grid-template-columns:260px 1fr;height:100vh;height:100dvh;height:var(--vh,100dvh);width:100%}
.sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-logo{font-weight:800;color:var(--accent);font-size:1.05em}
.sb-new{width:32px;height:32px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-size:1.3em;cursor:pointer;transition:all .2s;display:grid;place-items:center}
.sb-new:hover{background:var(--accent);border-color:var(--accent)}
.sb-chats{flex:1;overflow-y:auto;padding:8px}
.chat-item{padding:11px 14px;border-radius:8px;font-size:.88em;color:var(--muted);cursor:pointer;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:all .15s;white-space:nowrap;overflow:hidden}
.chat-item:hover{background:var(--panel-2);color:var(--text)}
.chat-item.active{background:rgba(124,92,255,.12);color:var(--text);border-left:2px solid var(--accent);padding-left:12px}
.chat-item-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.chat-item-del{opacity:0;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1em}
.chat-item:hover .chat-item-del{opacity:1}
.chat-item-del:hover{color:var(--red)}
.sb-foot{padding:14px 20px;border-top:1px solid var(--border);background:var(--panel-2)}
.sb-model{font-size:.78em;color:var(--muted);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-status{display:flex;align-items:center;gap:8px;font-size:.8em;color:var(--muted);margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ready{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.generating{background:var(--accent);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sb-settings{width:100%;padding:9px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:inherit;font-size:.82em;cursor:pointer;transition:all .2s}
.sb-settings:hover{color:var(--text);border-color:var(--accent)}
.main{display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0}
.chat-header{padding:16px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--panel);flex-shrink:0}
.ch-title{font-size:.96em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.ch-actions{display:flex;gap:8px}
.ch-btn{padding:7px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:inherit;font-size:.8em;cursor:pointer;transition:all .2s}
.ch-btn:hover{color:var(--text);border-color:var(--accent)}
.chat-scroll{flex:1;overflow-y:auto;padding:32px 28px;scroll-behavior:smooth;min-height:0;-webkit-overflow-scrolling:touch}
.chat-scroll::-webkit-scrollbar{width:8px}
.chat-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.welcome{max-width:640px;margin:40px auto;text-align:center}
.welcome-icon{font-size:3em;color:var(--accent);margin-bottom:16px;text-shadow:0 0 40px rgba(124,92,255,.5)}
.welcome h2{font-size:1.8em;margin-bottom:12px}
.welcome p{color:var(--muted);margin-bottom:32px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.suggestions button{padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.87em;cursor:pointer;text-align:left;transition:all .2s;line-height:1.4}
.suggestions button:hover{border-color:var(--accent);background:var(--panel-2);transform:translateY(-2px)}
.msg{max-width:820px;margin:0 auto 20px;animation:msgIn .35s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg-role{display:flex;align-items:center;gap:8px;font-size:.74em;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;color:var(--muted)}
.msg-role .avatar{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:1em}
.msg.user .msg-role .avatar{background:var(--panel-2);color:var(--text)}
.msg.bot .msg-role .avatar{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff}
.msg-body{padding:14px 18px;border-radius:12px;line-height:1.65;font-size:.94em;word-wrap:break-word;overflow-wrap:break-word}
.msg.user .msg-body{background:var(--panel);border:1px solid var(--border);white-space:pre-wrap}
.msg.bot .msg-body{background:linear-gradient(180deg,rgba(124,92,255,.06),rgba(124,92,255,.02));border:1px solid rgba(124,92,255,.15)}
.msg-body p{margin:0 0 10px}
.msg-body p:last-child{margin-bottom:0}
.msg-body strong{color:#fff;font-weight:700}
.msg-body em{color:#c4b5fd;font-style:italic}
.msg-body h1,.msg-body h2,.msg-body h3{margin:14px 0 8px;color:#fff;font-weight:700;line-height:1.3}
.msg-body h1{font-size:1.4em}.msg-body h2{font-size:1.2em}.msg-body h3{font-size:1.05em}
.msg-body ul,.msg-body ol{margin:8px 0 12px 22px}
.msg-body li{margin-bottom:5px}
.msg-body a{color:#a78bfa;text-decoration:underline}
.msg-body blockquote{border-left:3px solid var(--accent);padding-left:12px;margin:10px 0;color:var(--muted);font-style:italic}
.msg-body code:not(pre code){background:rgba(124,92,255,.12);color:#c4b5fd;padding:2px 6px;border-radius:5px;font-family:'SF Mono',Consolas,monospace;font-size:.88em;border:1px solid rgba(124,92,255,.2)}
.msg-body pre{background:#06060c;border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto;margin:10px 0;font-family:'SF Mono',Consolas,monospace;font-size:.85em;line-height:1.6}
.msg-body pre code{color:#e8e8f2;background:none;padding:0;border:none}
.msg-body hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.cursor-blink{display:inline-block;width:8px;height:1.05em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1s infinite;border-radius:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.msg-tools{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .2s}
.msg:hover .msg-tools{opacity:1}
.msg-tool{padding:5px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:inherit;font-size:.74em;cursor:pointer;transition:all .2s}
.msg-tool:hover{color:var(--text);border-color:var(--accent)}
.composer{padding:16px 28px 20px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.composer-inner{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:10px 12px 10px 18px;transition:border-color .2s}
.composer-inner:focus-within{border-color:var(--accent)}
#input{flex:1;background:transparent;border:none;color:var(--text);-webkit-text-fill-color:var(--text);caret-color:var(--accent);font-family:inherit;font-size:16px;line-height:1.5;resize:none;outline:none;max-height:200px;min-height:24px;padding:6px 0;-webkit-appearance:none;appearance:none}
#input::placeholder{color:var(--muted-2)}
#sendBtn{width:44px;height:44px;border-radius:10px;background:var(--accent);border:none;color:#fff;cursor:pointer;display:grid;place-items:center;transition:all .2s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
#sendBtn:hover:not(:disabled){background:var(--accent-dim);transform:scale(1.05)}
#sendBtn:active:not(:disabled){transform:scale(.95)}
#sendBtn:disabled{opacity:.3;cursor:not-allowed}
.composer-hint{max-width:820px;margin:8px auto 0;display:flex;justify-content:space-between;align-items:center;font-size:.75em;color:var(--muted);padding:0 4px}
.stop-btn{padding:4px 12px;background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.4);border-radius:6px;color:var(--red);font-family:inherit;font-size:1em;cursor:pointer;transition:all .2s}
.stop-btn:hover{background:rgba(230,57,70,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:500;padding:24px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.open{opacity:1;visibility:visible}
.modal-box{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:16px;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:transform .3s}
.modal.open .modal-box{transform:translateY(0)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:1.15em}
.modal-close{width:32px;height:32px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;display:grid;place-items:center}
.modal-close:hover{color:var(--red);border-color:var(--red)}
.modal-body{padding:24px}
.setting{margin-bottom:22px}
.setting label{display:block;font-size:.82em;font-weight:600;margin-bottom:8px;color:var(--text)}
.setting select,.setting textarea,.setting input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:inherit;font-size:16px;outline:none;transition:border-color .2s;resize:vertical}
.setting select:focus,.setting textarea:focus,.setting input:focus{border-color:var(--accent)}
.setting input[type=range]{width:100%;accent-color:var(--accent)}
.setting-hint{font-size:.75em;color:var(--muted);margin-top:6px;line-height:1.5}
.setting-hint a{color:var(--accent);text-decoration:underline}
@media(max-width:720px){
#app{grid-template-columns:1fr}
.sidebar{display:none}
.chat-scroll{padding:20px 16px}
.composer{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.composer-inner{padding:8px 8px 8px 16px}
.suggestions{grid-template-columns:1fr}
.chat-header{padding:12px 16px}
.ch-title{max-width:50%;font-size:.85em}
.ch-btn{padding:6px 12px;font-size:.75em}
.welcome{margin:20px auto}
.welcome h2{font-size:1.4em}
.msg-body{font-size:.9em;padding:12px 14px}
}
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-logo">◉ AI Chat</div>
      <button class="sb-new" id="newChatBtn" title="Новый чат">+</button>
    </div>
    <div class="sb-chats" id="chatList"></div>
    <div class="sb-foot">
      <div class="sb-model" id="sbModel">—</div>
      <div class="sb-status">
        <span class="dot ready" id="sbDot"></span>
        <span id="sbStatus">Готов</span>
      </div>
      <button class="sb-settings" id="settingsBtn">⚙ Настройки</button>
    </div>
  </aside>

  <main class="main">
    <header class="chat-header">
      <div class="ch-title" id="chatTitle">Новый чат</div>
      <div class="ch-actions">
        <button class="ch-btn" id="clearBtn">Очистить</button>
        <button class="ch-btn" id="exportBtn">Экспорт</button>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">◉</div>
        <h2>Чем помочь?</h2>
        <p>Работает через бесплатные AI API. Отвечает за секунды.</p>
        <div class="suggestions">
          <button data-prompt="Что такое HTML?">Что такое HTML?</button>
          <button data-prompt="Напиши функцию на JavaScript для сортировки массива">Сортировка в JS</button>
          <button data-prompt="Придумай короткий слоган для кофейни">Слоган для кофейни</button>
          <button data-prompt="Перечисли 5 планет Солнечной системы">5 планет</button>
        </div>
      </div>
      <div id="messages"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Напиши сообщение..." enterkeyhint="send" autocomplete="off" autocorrect="on" spellcheck="true"></textarea>
        <button id="sendBtn" title="Отправить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
      <div class="composer-hint">
        <span id="statusInfo">Готов</span>
        <button id="stopBtn" class="stop-btn hidden">■ Остановить</button>
      </div>
    </div>
  </main>

  <div class="modal" id="settingsModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Настройки</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting">
          <label>Провайдер</label>
          <select id="setProvider">
            <option value="pollinations">Pollinations — без ключа, новый API</option>
            <option value="g4f">g4f.dev — без ключа, GPT-4o/DeepSeek</option>
            <option value="openrouter">OpenRouter — нужен бесплатный ключ</option>
          </select>
          <div class="setting-hint" id="providerHint">Работает без ключа и регистрации</div>
        </div>
        <div class="setting" id="keyField" style="display:none">
          <label>API-ключ OpenRouter</label>
          <input type="text" id="setKey" placeholder="sk-or-v1-...">
          <div class="setting-hint">Получить бесплатно: <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a></div>
        </div>
        <div class="setting">
          <label>Модель</label>
          <select id="setModel"></select>
          <div class="setting-hint" id="modelHint"></div>
        </div>
        <div class="setting">
          <label>Системный промпт</label>
          <textarea id="setSystem" rows="3">Ты полезный ассистент. Отвечай кратко, по делу, на русском языке.</textarea>
        </div>
        <div class="setting">
          <label>Temperature: <span id="tempVal">0.7</span></label>
          <input type="range" id="setTemp" min="0" max="1.5" step="0.05" value="0.7">
        </div>
        <div class="setting">
          <label>Максимум токенов: <span id="tokensVal">512</span></label>
          <input type="range" id="setTokens" min="64" max="2048" step="64" value="512">
        </div>
        <button id="saveSettings" style="width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));border:none;border-radius:10px;color:#fff;font-size:.95em;font-weight:700;cursor:pointer;font-family:inherit">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══ Динамическая высота под клавиатуру ═══ */
function setVH(){
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--vh', h + 'px');
}
setVH();
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', setVH);
  window.visualViewport.addEventListener('scroll', setVH);
}
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', () => setTimeout(setVH, 200));

/* ═══ СОСТОЯНИЕ ═══ */
const state = {
  generating: false,
  abortController: null,
  currentChatId: null,
  chats: {},
  settings: {
    provider: 'pollinations',
    apiKey: '',
    model: 'openai',
    system: 'Ты полезный ассистент. Отвечай кратко, по делу, на русском языке.',
    temperature: 0.7,
    maxTokens: 512
  }
};

const LS_SETTINGS = 'aichat.settings.v3';
const LS_CHATS = 'aichat.chats.v3';
const $ = id => document.getElementById(id);

const chatScroll=$('chatScroll'),messagesEl=$('messages'),welcomeEl=$('welcome');
const inputEl=$('input'),sendBtn=$('sendBtn'),stopBtn=$('stopBtn');
const statusInfo=$('statusInfo'),chatTitle=$('chatTitle'),chatListEl=$('chatList');
const sbModel=$('sbModel'),sbDot=$('sbDot'),sbStatus=$('sbStatus');
const settingsModal=$('settingsModal'),setProvider=$('setProvider'),setKey=$('setKey');
const setModel=$('setModel'),setSystem=$('setSystem'),setTemp=$('setTemp'),setTokens=$('setTokens');
const tempVal=$('tempVal'),tokensVal=$('tokensVal'),keyField=$('keyField');
const modelHint=$('modelHint'),providerHint=$('providerHint');

/* ═══ МОДЕЛИ ПО ПРОВАЙДЕРАМ (актуальные на 2026) ═══ */
const MODELS = {
  pollinations: [
    { id: 'openai', name: 'GPT-4o mini (OpenAI)' },
    { id: 'openai-large', name: 'GPT-4o large' },
    { id: 'gemini', name: 'Google Gemini' },
    { id: 'gemini-search', name: 'Gemini + поиск' },
    { id: 'mistral', name: 'Mistral' },
    { id: 'qwen-coder', name: 'Qwen Coder' },
    { id: 'deepseek', name: 'DeepSeek' },
    { id: 'kimi', name: 'Kimi (Moonshot)' },
    { id: 'nova-fast', name: 'Nova Fast' },
    { id: 'grok', name: 'Grok (xAI)' }
  ],
  g4f: [
    { id: 'gpt-4.1', name: 'GPT-4.1' },
    { id: 'gpt-4o', name: 'GPT-4o' },
    { id: 'gpt-4o-mini', name: 'GPT-4o mini' },
    { id: 'deepseek-v3', name: 'DeepSeek V3' },
    { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash' },
    { id: 'claude-sonnet-4', name: 'Claude Sonnet 4' }
  ],
  openrouter: [
    { id: 'google/gemini-2.5-flash:free', name: 'Gemini 2.5 Flash (free)' },
    { id: 'deepseek/deepseek-r1:free', name: 'DeepSeek R1 (free)' },
    { id: 'qwen/qwen3-14b:free', name: 'Qwen 3 14B (free)' },
    { id: 'meta-llama/llama-3.3-70b-instruct:free', name: 'Llama 3.3 70B (free)' },
    { id: 'mistralai/mistral-small-3.2-24b-instruct:free', name: 'Mistral Small 3.2 (free)' }
  ]
};

/* ═══ ENDPOINTS ═══ */
const ENDPOINTS = {
  pollinations: {
    url: 'https://gen.pollinations.ai/v1/chat/completions',
    headers: () => ({ 'Content-Type': 'application/json' })
  },
  g4f: {
    url: 'https://g4f.dev/api/openai/v1/chat/completions',
    headers: () => ({ 'Content-Type': 'application/json' })
  },
  openrouter: {
    url: 'https://openrouter.ai/api/v1/chat/completions',
    headers: () => ({
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + state.settings.apiKey,
      'HTTP-Referer': location.origin || 'http://localhost',
      'X-Title': 'AI Chat'
    })
  }
};

/* ═══ НАСТРОЙКИ ═══ */
function loadSettings(){
  try { const raw = localStorage.getItem(LS_SETTINGS); if(raw) Object.assign(state.settings, JSON.parse(raw)); } catch(e){}
  setProvider.value = state.settings.provider;
  setKey.value = state.settings.apiKey || '';
  setSystem.value = state.settings.system;
  setTemp.value = state.settings.temperature;
  setTokens.value = state.settings.maxTokens;
  refreshSettingsUI();
}

function saveSettingsToDisk(){ localStorage.setItem(LS_SETTINGS, JSON.stringify(state.settings)); }

function refreshSettingsUI(){
  tempVal.textContent = state.settings.temperature.toFixed(2);
  tokensVal.textContent = state.settings.maxTokens;
  keyField.style.display = state.settings.provider === 'openrouter' ? 'block' : 'none';

  if(state.settings.provider === 'openrouter') providerHint.textContent = 'Нужен бесплатный ключ с openrouter.ai/keys';
  else if(state.settings.provider === 'g4f') providerHint.textContent = 'Прямой браузерный клиент, без ключа';
  else providerHint.textContent = 'Новый API (gen.pollinations.ai), без ключа';

  const models = MODELS[state.settings.provider] || [];
  setModel.innerHTML = models.map(m => '<option value="'+m.id+'">'+m.name+'</option>').join('');
  const ids = models.map(m => m.id);
  setModel.value = ids.includes(state.settings.model) ? state.settings.model : ids[0];
  state.settings.model = setModel.value;

  if(state.settings.provider === 'openrouter') modelHint.innerHTML = 'Бесплатные модели. Ключ: <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>';
  else modelHint.textContent = 'Без ключа и регистрации';

  const modelName = models.find(m => m.id === state.settings.model)?.name || state.settings.model;
  sbModel.textContent = modelName;
  sbStatus.textContent = state.settings.provider === 'pollinations' ? 'Pollinations' : state.settings.provider === 'g4f' ? 'g4f.dev' : 'OpenRouter';
}

/* ═══ ЧАТЫ ═══ */
function loadChats(){ try { const raw = localStorage.getItem(LS_CHATS); if(raw) state.chats = JSON.parse(raw); } catch(e){ state.chats = {}; } renderChatList(); }
function persistChats(){ try { localStorage.setItem(LS_CHATS, JSON.stringify(state.chats)); } catch(e){} }

function createChat(){
  const id = 'c' + Date.now();
  state.chats[id] = { title: 'Новый чат', messages: [], createdAt: Date.now() };
  state.currentChatId = id;
  persistChats(); renderChatList(); renderMessages();
}

function switchChat(id){ if(!state.chats[id]) return; state.currentChatId = id; renderChatList(); renderMessages(); }
function deleteChat(id, e){ e.stopPropagation(); delete state.chats[id]; persistChats();
  if(state.currentChatId === id){ const ids = Object.keys(state.chats); state.currentChatId = ids.length ? ids[ids.length-1] : null; if(!state.currentChatId) createChat(); }
  renderChatList(); renderMessages();
}
function currentChat(){ return state.chats[state.currentChatId]; }

function updateChatTitle(text){
  const chat = currentChat(); if(!chat) return;
  if(chat.messages.length <= 2){ chat.title = text.slice(0,40) + (text.length > 40 ? '…' : ''); persistChats(); renderChatList(); }
}

function renderChatList(){
  chatListEl.innerHTML = '';
  const ids = Object.keys(state.chats).sort((a,b) => state.chats[b].createdAt - state.chats[a].createdAt);
  ids.forEach(id => {
    const chat = state.chats[id];
    const item = document.createElement('div');
    item.className = 'chat-item' + (id === state.currentChatId ? ' active' : '');
    item.innerHTML = '<span class="chat-item-name">'+escapeHtml(chat.title)+'</span><button class="chat-item-del">×</button>';
    item.addEventListener('click', () => switchChat(id));
    item.querySelector('.chat-item-del').addEventListener('click', (e) => deleteChat(id, e));
    chatListEl.appendChild(item);
  });
}

function renderMessages(){
  const chat = currentChat(); messagesEl.innerHTML = '';
  if(!chat || chat.messages.length === 0){ welcomeEl.classList.remove('hidden'); chatTitle.textContent = 'Новый чат'; return; }
  welcomeEl.classList.add('hidden'); chatTitle.textContent = chat.title;
  chat.messages.forEach(m => { if(m.role === 'system') return; appendMessageEl(m.role, m.content); });
  scrollToBottom();
}

function appendMessageEl(role, content){
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const roleLabel = role === 'user' ? 'Вы' : 'AI';
  const avatarChar = role === 'user' ? '›' : '◉';
  msg.innerHTML = '<div class="msg-role"><span class="avatar">'+avatarChar+'</span><span>'+roleLabel+'</span></div><div class="msg-body"></div><div class="msg-tools"><button class="msg-tool" data-action="copy">Копировать</button></div>';
  const body = msg.querySelector('.msg-body');
  if(role === 'user') body.textContent = content; else body.innerHTML = renderMarkdown(content);
  msg.querySelector('[data-action="copy"]').addEventListener('click', async (e) => {
    try { await navigator.clipboard.writeText(content); e.target.textContent = '✓ Скопировано'; setTimeout(() => { e.target.textContent = 'Копировать'; }, 1500); } catch(err){}
  });
  messagesEl.appendChild(msg); return body;
}

function scrollToBottom(){ requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; }); }

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderMarkdown(text){
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => '<pre><code>'+c.trim()+'</code></pre>');
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>'); html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>'); html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  html = html.replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>'); html = html.replace(/(<li>[\s\S]*?<\/li>)/g, (m) => '<ul>'+m+'</ul>'); html = html.replace(/<\/ul>\s*<ul>/g, '');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>'); html = html.replace(/^---$/gm, '<hr>');
  html = html.split('\n').map(line => { if(/^\s*<(h[1-3]|ul|ol|li|pre|blockquote|hr)/.test(line)) return line; if(line.trim() === '') return ''; return '<p>'+line+'</p>'; }).join('\n');
  html = html.replace(/<p>\s*<\/p>/g, ''); return html;
}

/* ═══ ОТПРАВКА С АВТОПЕРЕКЛЮЧЕНИЕМ ПРОВАЙДЕРА ═══ */
async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || state.generating) return;
  if(!state.currentChatId) createChat();
  const chat = currentChat();

  chat.messages.push({ role: 'user', content: text });
  welcomeEl.classList.add('hidden');
  appendMessageEl('user', text); scrollToBottom();
  inputEl.value = ''; autoResize(); updateChatTitle(text);

  const botBody = appendMessageEl('bot', '');
  botBody.innerHTML = '<span class="cursor-blink"></span>'; scrollToBottom();

  state.generating = true; sendBtn.disabled = true; stopBtn.classList.remove('hidden');
  sbDot.className = 'dot generating'; sbStatus.textContent = 'Генерация...';
  state.abortController = new AbortController();

  const messages = [
    { role: 'system', content: state.settings.system },
    ...chat.messages.slice(-20).map(m => ({ role: m.role, content: m.content }))
  ];

  // Список провайдеров для попытки
  const providersToTry = state.settings.provider === 'openrouter'
    ? ['openrouter']
    : state.settings.provider === 'g4f'
    ? ['g4f', 'pollinations']
    : ['pollinations', 'g4f'];

  let fullResponse = '';
  let lastError = null;
  let usedProvider = null;

  for(const provider of providersToTry){
    try {
      const endpoint = ENDPOINTS[provider];
      if(provider === 'openrouter' && !state.settings.apiKey) throw new Error('Нужен API-ключ OpenRouter');

      // Подбираем модель под провайдера
      const models = MODELS[provider] || [];
      let model = state.settings.model;
      if(!models.find(m => m.id === model)) model = models[0]?.id || 'openai';

      const res = await fetch(endpoint.url, {
        method: 'POST',
        headers: endpoint.headers(),
        body: JSON.stringify({ model, messages, temperature: state.settings.temperature, max_tokens: state.settings.maxTokens, stream: true }),
        signal: state.abortController.signal
      });

      if(!res.ok){ const errText = await res.text(); throw new Error('HTTP ' + res.status + ': ' + errText.slice(0,150)); }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      fullResponse = '';
      usedProvider = provider;

      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n'); buffer = lines.pop();
        for(const line of lines){
          const trimmed = line.trim(); if(!trimmed || !trimmed.startsWith('data:')) continue;
          const data = trimmed.slice(5).trim(); if(data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content;
            if(delta){ fullResponse += delta; botBody.innerHTML = renderMarkdown(fullResponse) + '<span class="cursor-blink"></span>'; scrollToBottom(); }
          } catch(e){}
        }
      }

      if(fullResponse.trim()) break; // Успех
      else throw new Error('Пустой ответ');

    } catch(err){
      if(err.name === 'AbortError'){ lastError = err; break; }
      console.warn('Провайдер ' + provider + ' не сработал:', err.message);
      lastError = err;
      fullResponse = '';
      botBody.innerHTML = '<span class="cursor-blink"></span>';
    }
  }

  try {
    if(lastError && !fullResponse.trim()){
      if(lastError.name === 'AbortError'){ botBody.textContent = '(остановлено)'; }
      else {
        botBody.innerHTML = '<strong>Все провайдеры недоступны.</strong><br><br><span style="color:var(--muted);font-size:.9em">Последняя ошибка: '+escapeHtml(lastError.message)+'<br><br>Попробуй сменить провайдера или модель в настройках.</span>';
      }
    } else {
      botBody.innerHTML = renderMarkdown(fullResponse);
      chat.messages.push({ role: 'assistant', content: fullResponse });
      persistChats();
      const pName = usedProvider === 'pollinations' ? 'Pollinations' : usedProvider === 'g4f' ? 'g4f.dev' : 'OpenRouter';
      statusInfo.textContent = 'Ответ от ' + pName;
    }
  } finally {
    state.generating = false; state.abortController = null;
    sendBtn.disabled = false; stopBtn.classList.add('hidden');
    sbDot.className = 'dot ready';
    sbStatus.textContent = state.settings.provider === 'pollinations' ? 'Pollinations' : state.settings.provider === 'g4f' ? 'g4f.dev' : 'OpenRouter';
    scrollToBottom();
  }
}

function autoResize(){ inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px'; }

function exportChat(){
  const chat = currentChat(); if(!chat || chat.messages.length === 0){ alert('Нечего экспортировать'); return; }
  let md = '# ' + chat.title + '\n\n';
  chat.messages.forEach(m => { md += '**' + (m.role === 'user' ? 'Вы' : 'AI') + ':**\n\n' + m.content + '\n\n---\n\n'; });
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = chat.title.replace(/[^\wа-я\s-]/gi,'').trim() + '.md'; a.click();
  URL.revokeObjectURL(url);
}

function init(){
  loadSettings(); loadChats();
  if(Object.keys(state.chats).length === 0) createChat();
  else { const ids = Object.keys(state.chats).sort((a,b) => state.chats[b].createdAt - state.chats[a].createdAt); state.currentChatId = ids[0]; renderChatList(); renderMessages(); }

  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
  inputEl.addEventListener('focus', () => { setTimeout(() => { chatScroll.scrollTop = chatScroll.scrollHeight; }, 300); });
  sendBtn.addEventListener('click', sendMessage);
  stopBtn.addEventListener('click', () => state.abortController && state.abortController.abort());
  $('newChatBtn').addEventListener('click', () => createChat());
  $('clearBtn').addEventListener('click', () => { const chat = currentChat(); if(!chat) return; if(!confirm('Очистить текущий чат?')) return; chat.messages = []; chat.title = 'Новый чат'; persistChats(); renderChatList(); renderMessages(); });
  $('exportBtn').addEventListener('click', exportChat);

  document.querySelectorAll('[data-prompt]').forEach(btn => { btn.addEventListener('click', () => { inputEl.value = btn.dataset.prompt; autoResize(); sendMessage(); }); });

  $('settingsBtn').addEventListener('click', () => settingsModal.classList.add('open'));
  $('modalClose').addEventListener('click', () => settingsModal.classList.remove('open'));
  settingsModal.addEventListener('click', e => { if(e.target === settingsModal) settingsModal.classList.remove('open'); });

  setProvider.addEventListener('change', () => { state.settings.provider = setProvider.value; refreshSettingsUI(); });
  setModel.addEventListener('change', () => { state.settings.model = setModel.value; const models = MODELS[state.settings.provider] || []; const name = models.find(m => m.id === state.settings.model)?.name || state.settings.model; sbModel.textContent = name; });
  setTemp.addEventListener('input', () => { tempVal.textContent = parseFloat(setTemp.value).toFixed(2); });
  setTokens.addEventListener('input', () => { tokensVal.textContent = setTokens.value; });

  $('saveSettings').addEventListener('click', () => {
    state.settings.provider = setProvider.value;
    state.settings.apiKey = setKey.value.trim();
    state.settings.model = setModel.value;
    state.settings.system = setSystem.value;
    state.settings.temperature = parseFloat(setTemp.value);
    state.settings.maxTokens = parseInt(setTokens.value);
    if(state.settings.provider === 'openrouter' && !state.settings.apiKey){ alert('Для OpenRouter нужен бесплатный API-ключ. Получи его на openrouter.ai/keys'); return; }
    saveSettingsToDisk(); refreshSettingsUI(); settingsModal.classList.remove('open');
  });

  document.addEventListener('keydown', e => { if(e.key === 'Escape') settingsModal.classList.remove('open'); });
}

init();
</script>
